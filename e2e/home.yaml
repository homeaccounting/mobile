# Email sign-in → accounts → prompt → balance changes.
# Needs a local backend with LLM_API_KEY set and the dev build running; see `just e2e`.
appId: com.homeaccounting.app
env:
  # The app's view of the backend; the seed script always runs on the host.
  SERVER_URL: http://localhost:8080
  API_URL: http://localhost:8080
---
- runScript: seed.js
- launchApp
# The keychain survives reinstalls on iOS, so an earlier run may still be signed in.
- runFlow:
    when:
      visible: Settings
    commands:
      - tapOn: Settings
      - tapOn: Sign out
- tapOn: Change
- tapOn: Server
- eraseText
- inputText: ${SERVER_URL}
- tapOn: Email
- inputText: ${output.email}
- tapOn: Password
- inputText: ${output.password}
- tapOn: Sign in
- assertVisible: Wallet
# Text selectors are regexes.
- assertVisible: \$100\.00
- tapOn: What did you spend or earn?
- inputText: coffee 4.50
- tapOn: Send
- extendedWaitUntil:
    visible: .*· Wallet
    timeout: 60000
- assertVisible: \$95\.50
